name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The Gradle build needs a local.properties pointing at an SDK; the runner image
      # ships one, and ANDROID_HOME is what the Android Gradle Plugin falls back to.
      - name: Configure SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: kscanner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  minified:
    name: Minified build check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # R8 runs here so a ProGuard rule that strips something ML Kit needs at runtime is
      # caught on every push rather than at tag time. No artifact is published: unsigned
      # output would only be confusing next to the signed APK from the Release workflow.
      - name: Compile minified release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Confirm the build was unsigned, as expected without secrets
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk > /dev/null 2>&1; then
            echo "::warning::This CI job produced a signed APK; signing secrets are visible to it."
          else
            echo "Unsigned, as expected."
          fi
