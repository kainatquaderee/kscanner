name: Release

# Publishes a signed APK to a GitHub Release.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# or run it manually from the Actions tab. Signing credentials come from repository
# secrets; without them the job stops before it can publish anything.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.0.0 (created from the selected commit if absent)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Fail early and legibly rather than shipping an unsigned APK by accident.
      - name: Require signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them with: gh secret set <NAME> < <value-file>"
            exit 1
          fi
          echo "All four signing secrets are present."

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/kscanner-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "KSCANNER_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          # Prove the keystore and password actually work before spending time building.
          keytool -list -keystore "$KEYSTORE" -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" > /dev/null
          echo "Keystore decoded and '$RELEASE_KEY_ALIAS' is readable."

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          KSCANNER_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KSCANNER_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KSCANNER_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION_NAME="${RELEASE_TAG#v}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          ./gradlew :app:assembleRelease --stacktrace \
            -PversionName="$VERSION_NAME" \
            -PversionCode="${{ github.run_number }}"

      - name: Verify signature and checksum
        id: verify
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk

          # Non-zero exit here means the APK is unsigned or the signature is broken,
          # which must never reach a release.
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          FINGERPRINT=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c %s "$APK")

          echo "FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "APK_BYTES=$SIZE" >> "$GITHUB_ENV"
          echo "Signed with certificate SHA-256 $FINGERPRINT"

      - name: Write release notes
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          KScanner ${VERSION_NAME} — signed release build.

          ### Install

          1. Download \`app-release.apk\` below onto your Android device (Android 8.0 / API 26 or newer).
          2. Open it and allow installing from this source when prompted.
          3. If you already have KScanner installed from a *different* key, uninstall it first —
             Android refuses updates signed by another certificate.

          ### Verify the download

          \`\`\`
          sha256sum app-release.apk
          # $SHA256
          \`\`\`

          Signed with APK Signature Scheme v2 and v3. To check the certificate:

          \`\`\`
          apksigner verify --print-certs app-release.apk
          # Signer #1 certificate SHA-256 digest: $FINGERPRINT
          \`\`\`

          APK size: $APK_BYTES bytes.
          EOF
          echo "NOTES_FILE=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists; replacing the APK asset."
            gh release upload "$RELEASE_TAG" "$APK" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "KScanner $VERSION_NAME" \
              --notes-file "$NOTES_FILE"
          elif git rev-parse -q --verify "refs/tags/$RELEASE_TAG" > /dev/null; then
            gh release create "$RELEASE_TAG" \
              --title "KScanner $VERSION_NAME" \
              --notes-file "$NOTES_FILE" \
              "$APK"
          else
            echo "Tag $RELEASE_TAG does not exist; creating it at $GITHUB_SHA."
            gh release create "$RELEASE_TAG" \
              --title "KScanner $VERSION_NAME" \
              --notes-file "$NOTES_FILE" \
              --target "$GITHUB_SHA" \
              "$APK"
          fi

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: kscanner-release-apk-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kscanner-release.jks"
