name: Release

# Publishes a signed APK to a GitHub Release.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# or run it manually from the Actions tab. Signing credentials come from repository
# secrets; without them the job stops before it can publish anything.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.0.0 (created from the selected commit if absent)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Fail early and legibly rather than shipping an unsigned APK by accident.
      - name: Require signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them with: gh secret set <NAME> < <value-file>"
            exit 1
          fi
          echo "All four signing secrets are present."

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/kscanner-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "KSCANNER_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          # Prove the keystore and password actually work before spending time building.
          keytool -list -keystore "$KEYSTORE" -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" > /dev/null
          echo "Keystore decoded and '$RELEASE_KEY_ALIAS' is readable."

      - name: Derive version from tag
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"

          # versionCode is derived from the tag rather than the run number so that a
          # rebuild of an old tag yields the identical APK version. github.run_number
          # restarts at 1 for every new workflow, so it would neither reproduce nor
          # stay above earlier releases.
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$RELEASE_TAG' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          MAJOR=$((10#${BASH_REMATCH[1]}))
          MINOR=$((10#${BASH_REMATCH[2]}))
          PATCH=$((10#${BASH_REMATCH[3]}))
          if (( MINOR > 99 || PATCH > 99 )); then
            echo "::error::Minor and patch must be below 100 to keep versionCode unambiguous"
            exit 1
          fi
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          if (( VERSION_CODE < 1 )); then
            echo "::error::versionCode must be at least 1"
            exit 1
          fi

          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "$RELEASE_TAG -> versionName $VERSION, versionCode $VERSION_CODE"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          KSCANNER_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KSCANNER_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KSCANNER_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Verify signature and checksum
        id: verify
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk

          # Non-zero exit here means the APK is unsigned or the signature is broken,
          # which must never reach a release.
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          # Guard that the -P overrides actually reached AndroidManifest merging. A
          # silently ignored property would publish an APK with the checked-in default
          # version, which is how versionCode 1 slipped into the first release.
          AAPT2=$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT2" dump badging "$APK" 2>/dev/null | head -1)
          ACTUAL_CODE=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$BADGING")
          ACTUAL_NAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")
          if [ "$ACTUAL_CODE" != "$VERSION_CODE" ] || [ "$ACTUAL_NAME" != "$VERSION_NAME" ]; then
            echo "::error::APK reports versionName='$ACTUAL_NAME' versionCode='$ACTUAL_CODE'; expected '$VERSION_NAME' / '$VERSION_CODE'"
            exit 1
          fi
          echo "APK reports versionName $ACTUAL_NAME, versionCode $ACTUAL_CODE."

          FINGERPRINT=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c %s "$APK")

          echo "FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "APK_BYTES=$SIZE" >> "$GITHUB_ENV"
          echo "Signed with certificate SHA-256 $FINGERPRINT"

      - name: Write release notes
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          KScanner ${VERSION_NAME} — signed release build.

          ### Install

          1. Download \`app-release.apk\` below onto your Android device (Android 8.0 / API 26 or newer).
          2. Open it and allow installing from this source when prompted.
          3. If you already have KScanner installed from a *different* key, uninstall it first —
             Android refuses updates signed by another certificate.

          ### Verify the download

          \`\`\`
          sha256sum app-release.apk
          # $SHA256
          \`\`\`

          Signed with APK Signature Scheme v2 and v3. To check the certificate:

          \`\`\`
          apksigner verify --print-certs app-release.apk
          # Signer #1 certificate SHA-256 digest: $FINGERPRINT
          \`\`\`

          APK size: $APK_BYTES bytes. versionName $VERSION_NAME, versionCode $VERSION_CODE.
          EOF
          echo "NOTES_FILE=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists; replacing the APK asset."
            gh release upload "$RELEASE_TAG" "$APK" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "KScanner $VERSION_NAME" \
              --notes-file "$NOTES_FILE"
          elif git rev-parse -q --verify "refs/tags/$RELEASE_TAG" > /dev/null; then
            gh release create "$RELEASE_TAG" \
              --title "KScanner $VERSION_NAME" \
              --notes-file "$NOTES_FILE" \
              "$APK"
          else
            echo "Tag $RELEASE_TAG does not exist; creating it at $GITHUB_SHA."
            gh release create "$RELEASE_TAG" \
              --title "KScanner $VERSION_NAME" \
              --notes-file "$NOTES_FILE" \
              --target "$GITHUB_SHA" \
              "$APK"
          fi

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: kscanner-release-apk-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kscanner-release.jks"
